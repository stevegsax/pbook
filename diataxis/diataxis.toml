[project]
name = "pbook"
description = "Knowledge playbook service for LLM-assisted workflows"
type = "project-docs"
audience = "Engineers integrating pbook into their projects or operating it as a service"
purpose = "Prevent LLM agents from repeating mistakes by surfacing relevant, hard-won lessons at the moment they are needed"
prerequisites = "Python, Temporal basics, Pydantic, SQLAlchemy, CLI tools"
introduction = """
## Why pbook exists

LLM agents repeat mistakes. When an agent encounters a library quirk, an
undocumented API behavior, or a subtle configuration pitfall, the lesson
disappears at the end of the session. The next invocation starts from scratch,
makes the same wrong first attempt, and burns the same debugging cycles.

This is the problem that **Agentic Context Engineering** addresses. Research
(Zhang et al., "Agentic Context Engineering," ICLR 2026) demonstrates that
treating an LLM's context as an evolving **playbook** — a structured collection
of strategies, pitfalls, and domain-specific knowledge that accumulates over
time — yields large improvements over static prompts. On agent benchmarks, the
approach improved accuracy by 10.6% over strong baselines. The key insight is
that contexts should function as comprehensive, detailed playbooks rather than
compressed summaries. Monolithic context rewriting leads to **brevity bias**
(collapsing toward generic advice) and **context collapse** (eroding detailed
knowledge through iterative summarization). Structured, incremental updates
avoid both failure modes.

pbook is an implementation of this principle. It stores lessons extracted from
real project experience and surfaces them at the moment they are relevant —
giving the LLM the specific, hard-won knowledge it needs before it starts
working. Every entry must clear a strict quality bar: it must be **unexpected**
(the default approach would have been wrong) and **actionable** (there is
specific advice that helps next time). Generic advice like "use proper error
handling" is rejected. Specific advice like "Mistral OCR returns base64 with a
`data:` URI prefix — strip it before decoding" is kept. See
[why the quality bar exists](explanation/quality-bar.html) for the reasoning
behind this constraint.

In practice, pbook runs as a Temporal worker alongside your project. Client
workflows push experience data (what went wrong, how it was fixed), and pbook's
extraction pipeline distills it into structured entries tagged by language,
library, domain, and project. When the LLM needs context — writing new code or
debugging a failure — the [retrieval system](explanation/retrieval-ranking.html)
ranks entries by tag overlap and intent mode, packing the most relevant ones
within a token budget. The result is a focused playbook section injected into
the LLM's context: not a summary of everything pbook knows, but the specific
entries that match the current task.

pbook manages three content types: **pitfalls** extracted from experience,
**curated advice** submitted by humans, and **API doc records** with method
signatures and examples. All are managed through a
[CLI](reference/cli.html) or [Temporal workflows](reference/workflows.html)
and stored in a [SQLite database](reference/data-model.html) with
[namespaced tags](reference/tags.html) for retrieval.
"""

[topics.getting-started]
title = "Getting Started"
description = "First-time setup and basic usage of pbook"
complexity = "beginner"
order = 1

[topics.getting-started.tutorials]
file = "tutorials/getting-started.md"
status = "draft"
covers = [
    "Starting the pbook worker",
    "Adding a curated entry via CLI",
    "Listing and retrieving entries",
    "Pushing experience data for extraction",
    "Reviewing and approving extracted entries",
]
detail = """Walk through the full lifecycle: worker startup, add an entry, \
query it back, push experience, review results. Use real CLI commands with \
concrete example JSON files. Show output at every step."""
guidance = """Use first-person plural. Concrete, not abstract. One path — \
no alternatives or options. The reader should have a working pbook with \
entries in it by the end. Use numbered step headings (Step 1:, Step 2:, etc.). \
Keep narrative tight — observation statements, not explanations. Link to \
explanation/quality-bar.md for why the quality constraints exist."""

[topics.api-docs]
title = "Adding API Documentation"
description = "Adding structured API documentation entries to the playbook"
complexity = "beginner"
order = 2

[topics.api-docs.tutorials]
file = "tutorials/adding-api-docs.md"
status = "draft"
covers = [
    "Creating an ApiDocRecord JSON file",
    "Adding an api_doc entry via CLI",
    "Verifying api_doc entries",
    "Seeing api_doc entries in retrieval results",
]
detail = """Walk through creating and adding an api_doc entry. Show the \
JSON structure with the serialized ApiDocRecord content field. Verify \
via list and get. Show how api_doc entries appear in retrieval."""
guidance = """Use first-person plural. Numbered step headings. One path. \
Emphasize the nested JSON structure (ApiDocRecord serialized inside \
content field). Link to reference/data-model.md for field details."""

[topics.entries]
title = "Managing Entries"
description = "Adding, updating, reviewing, and removing playbook entries"
complexity = "beginner"
order = 3

[topics.entries.howto]
file = "howto/manage-entries.md"
status = "draft"
covers = [
    "How to add a curated advice entry",
    "How to check for duplicates before adding",
    "How to update an existing entry",
    "How to review and approve extracted entries",
    "How to reject a low-quality entry",
]
detail = "Task-focused, no teaching. Assume the reader has completed the tutorial."
guidance = """Each task is a separate headed section. Include the CLI command \
and a minimal JSON example. Link to reference/cli.md for full option lists. \
Link to reference/data-model.md for field details."""

[topics.retrieval]
title = "Retrieval and Ranking"
description = "Querying entries by tag with intent-based ranking"
complexity = "intermediate"
order = 4
prerequisites = ["entries"]

[topics.retrieval.howto]
file = "howto/retrieve-entries.md"
status = "draft"
covers = [
    "How to query entries by tag via CLI",
    "How to retrieve entries via Temporal workflow",
    "How to use create vs fix mode",
    "How to control the token budget",
    "How to exclude unreviewed entries",
]
detail = "Show both CLI and Temporal workflow examples. Emphasize mode selection."
guidance = """Include Python code for Temporal workflow calls. Show the \
RetrievalInput model fields. Keep mode descriptions directive (use X for Y), \
not explanatory — link to explanation/retrieval-ranking.md for design rationale."""

[topics.retrieval.explanation]
file = "explanation/retrieval-ranking.md"
status = "draft"
covers = [
    "Why retrieval has two modes (create vs fix)",
    "How tag overlap scoring works",
    "How mode-based weighting affects ranking",
    "How token budget packing works",
    "Why entries are ranked, not just filtered",
]
detail = "Discursive. Connect the ranking design to the problem it solves."
guidance = """Explain the intuition: when writing new code you want best \
practices; when debugging you want project-specific gotchas. The scoring \
algorithm is a means to this end, not the point. Link to \
reference/data-model.md for tag namespace details."""

[topics.extraction]
title = "Experience Extraction"
description = "Pushing experience data and the LLM extraction pipeline"
complexity = "intermediate"
order = 5
prerequisites = ["entries"]

[topics.extraction.howto]
file = "howto/push-experience.md"
status = "draft"
covers = [
    "How to push experience data via CLI",
    "How to push experience via Temporal workflow",
    "How to structure the PushExperienceInput",
]
detail = "Show both CLI and Temporal examples with real JSON."
guidance = """Keep input structuring advice brief and directive — one or two \
sentences, then link to explanation/quality-bar.md for the reasoning. Do not \
inline extended explanation of what makes good vs bad input."""

[topics.extraction.explanation]
file = "explanation/quality-bar.md"
status = "draft"
covers = [
    "Why the quality bar exists",
    "What 'unexpected + actionable' means in practice",
    "Why generic advice is excluded",
    "How the extraction prompt enforces quality",
    "The optimistic review model (needs-review tag)",
]
detail = "Discursive. This is the most important concept in pbook."
guidance = """Center on the core principle: better to miss than mislead. \
Connect to real examples — 'always use type hints' is too generic, but \
'Mistral OCR returns base64 with a data URI prefix' is specific and \
unexpected. Link to reference/workflows.md for the extraction prompt."""

[topics.tags]
title = "Tag System"
description = "Namespaced tags and their role in retrieval"
complexity = "beginner"
order = 6

[topics.tags.reference]
file = "reference/tags.md"
status = "draft"
covers = [
    "All five tag namespaces with valid values",
    "General vs extracted tier distinction",
    "Tag validation rules",
    "Tag inference from file extensions and keywords",
]
detail = "Tabular. One table per namespace with valid values and sources."
guidance = """Use tables consistently. Show the extension-to-language and \
keyword-to-domain mappings. Cross-link to explanation/retrieval-ranking.md \
for how tags affect ranking, and howto/retrieve-entries.md for practical usage."""

