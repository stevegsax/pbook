guidance = """Use consistent formatting per workflow: input model, output \
model, numbered steps with timeout. Activity summary table at the end. \
Cross-link to howto/retrieve-entries.md, howto/push-experience.md, \
howto/manage-entries.md, data-model.md, and explanation/quality-bar.md."""

[topics.workflows.howto]
file = "howto/temporal-integration.md"
status = "draft"
covers = [
    "How to call pbook workflows from another Temporal worker",
    "How to set up cross-queue workflow execution",
    "How to use pbook as a Python library without Temporal",
]
detail = "Python code examples for each integration path."
guidance = """Show complete, runnable code. Include imports. Cover both \
Temporal and direct library usage. Jump straight to task sections — no \
explanatory preamble. Link to reference/workflows.md for workflow details."""

[topics.architecture]
title = "Architecture"
description = "Design principles and system structure"
complexity = "intermediate"
order = 10

[topics.architecture.explanation]
file = "explanation/architecture.md"
status = "draft"
covers = [
    "Why pbook has its own database and worker",
    "Why tags are namespaced with a controlled vocabulary",
    "The two ingestion paths and when to use each",
    "Function Core / Imperative Shell pattern",
    "How sax-llm provides LLM access",
]
detail = "Discursive. Connect design decisions to the problems they solve."
guidance = """Focus on rationale, not implementation. Defer sax-llm internals \
to that project's documentation — just explain that pbook uses it for LLM \
calls and how the provider is registered. Link to reference/data-model.md \
for specifics."""
