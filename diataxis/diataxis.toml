[project]
name = "pbook"
description = "Knowledge playbook service for LLM-assisted workflows"
type = "project-docs"
audience = "Engineers integrating pbook into their projects or operating it as a service"
purpose = "Prevent LLM agents from repeating mistakes by surfacing relevant, hard-won lessons at the moment they are needed"
prerequisites = "Python, Temporal basics, Pydantic, SQLAlchemy, CLI tools"

[topics.getting-started]
title = "Getting Started"
description = "First-time setup and basic usage of pbook"
complexity = "beginner"
order = 1

[topics.getting-started.tutorials]
file = "tutorials/getting-started.md"
status = "draft"
covers = [
    "Initializing the database",
    "Adding a curated entry via CLI",
    "Listing and retrieving entries",
    "Checking for duplicates",
    "Recording feedback on entries",
    "Identifying prune candidates",
    "Pushing experience data for extraction (requires Temporal)",
    "Reviewing and approving extracted entries",
]
detail = """Walk through the full lifecycle in two tiers: CLI-only operations \
first (migrate, add, list, get, check-duplicate, feedback, prune), then the \
Temporal workflow path (push, review, approve). Use real CLI commands with \
concrete example JSON files. Show output at every step."""
guidance = """Use first-person plural. Concrete, not abstract. One path — \
no alternatives or options. The reader should have a working pbook with \
entries in it by the end. Steps 1-6 require no Temporal server. Step 7 \
introduces the extraction pipeline as an optional next step. Link to \
explanation/quality-bar.md for why the quality constraints exist."""

[topics.entries]
title = "Managing Entries"
description = "Adding, updating, reviewing, and removing playbook entries"
complexity = "beginner"
order = 3

[topics.entries.howto]
file = "howto/manage-entries.md"
status = "draft"
covers = [
    "How to add a curated advice entry",
    "How to check for duplicates before adding",
    "How to update an existing entry",
    "How to review and approve extracted entries",
    "How to reject a low-quality entry",
    "How to record feedback on retrieved entries",
    "How to identify and prune harmful or stale entries",
]
detail = "Task-focused, no teaching. Assume the reader has completed the tutorial."
guidance = """Each task is a separate headed section. Include the CLI command \
and a minimal JSON example. Link to reference/cli.md for full option lists. \
Link to reference/data-model.md for field details. The feedback and pruning \
sections should be brief and directive — show the command, mention the effect \
on ranking, and link to explanation/retrieval-ranking.md for details."""

[topics.retrieval]
title = "Retrieval and Ranking"
description = "Querying entries by tag with intent-based ranking"
complexity = "intermediate"
order = 4
prerequisites = ["entries"]

[topics.retrieval.howto]
file = "howto/retrieve-entries.md"
status = "draft"
covers = [
    "How to query entries by tag via CLI",
    "How to retrieve entries via Temporal workflow",
    "How to use create vs fix mode",
    "How to control the token budget",
    "How to exclude unreviewed entries",
]
detail = "Show both CLI and Temporal workflow examples. Emphasize mode selection."
guidance = """Include Python code for Temporal workflow calls. Show the \
RetrievalInput model fields. Keep mode descriptions directive (use X for Y), \
not explanatory — link to explanation/retrieval-ranking.md for design rationale."""

[topics.retrieval.explanation]
file = "explanation/retrieval-ranking.md"
status = "draft"
covers = [
    "Why retrieval has two modes (create vs fix)",
    "How tag overlap scoring works",
    "How mode-based weighting affects ranking",
    "How helpfulness feedback adjusts ranking",
    "How token budget packing works",
    "Why entries are ranked, not just filtered",
]
detail = "Discursive. Connect the ranking design to the problem it solves."
guidance = """Explain the intuition: when writing new code you want best \
practices; when debugging you want project-specific gotchas. The scoring \
algorithm is a means to this end, not the point. Include a section on \
helpfulness-aware scoring: entries with feedback counters get boosted or \
penalized based on their helpful/harmful ratio, but only after a minimum \
retrieval threshold (3). Connect this to the ACE paper's insight that \
playbooks should evolve based on usage signals. Link to \
reference/data-model.md for tag namespace details."""

[topics.extraction]
title = "Experience Extraction"
description = "Pushing experience data and the LLM extraction pipeline"
complexity = "intermediate"
order = 5
prerequisites = ["entries"]

[topics.extraction.howto]
file = "howto/push-experience.md"
status = "draft"
covers = [
    "How to push experience data via CLI",
    "How to push experience via Temporal workflow",
    "How to structure the PushExperienceInput",
]
detail = "Show both CLI and Temporal examples with real JSON."
guidance = """Keep input structuring advice brief and directive — one or two \
sentences, then link to explanation/quality-bar.md for the reasoning. Do not \
inline extended explanation of what makes good vs bad input."""

[topics.extraction.explanation]
file = "explanation/quality-bar.md"
status = "draft"
covers = [
    "Why the quality bar exists",
    "What 'unexpected + actionable' means in practice",
    "Why generic advice is excluded",
    "How the extraction prompt enforces quality",
    "The optimistic review model (needs-review tag)",
]
detail = "Discursive. This is the most important concept in pbook."
guidance = """Center on the core principle: better to miss than mislead. \
Connect to real examples — 'always use type hints' is too generic, but \
'Mistral OCR returns base64 with a data URI prefix' is specific and \
unexpected. Link to reference/workflows.md for the extraction prompt."""

[topics.ingestion]
title = "Transcript Ingestion"
description = "Batch ingestion of Claude Code conversation transcripts"
complexity = "intermediate"
order = 6
prerequisites = ["extraction"]

[topics.ingestion.howto]
file = "howto/ingest-transcripts.md"
status = "draft"
covers = [
    "How to preview sessions with dry-run",
    "How to ingest a single session",
    "How to batch-ingest all sessions",
    "How to filter by project",
    "How to reprocess already-ingested sessions",
]
detail = "Task-focused CLI examples. Assume forge worker and pbook worker are running."
guidance = """Show the CLI commands with real output examples. Start with \
dry-run (no Temporal required), then single-session, then batch. Mention \
that LLM analysis is routed through forge's batch API. Link to \
explanation/architecture.md for why forge is involved and \
reference/cli.md for full option details."""

[topics.import-workflow]
title = "Claude Code Import Workflow"
description = "End-to-end procedure for importing Claude Code conversations into pbook"
complexity = "intermediate"
order = 7
prerequisites = ["ingestion"]

[topics.import-workflow.howto]
file = "howto/import-claude-conversations.md"
status = "draft"
covers = [
    "Starting the required services (Temporal, forge worker, pbook worker)",
    "Discovering Claude Code sessions with dry-run",
    "Running the batch import",
    "Reviewing extracted entries",
    "Handling import failures and re-running",
]
detail = """End-to-end workflow walkthrough. Ordered steps that take the \
reader from zero to extracted entries in the playbook. Assume the reader \
already has pbook and forge installed."""
guidance = """This is a workflow-oriented how-to (different from \
ingest-transcripts.md which is task-reference style). Present the full \
procedure as an ordered sequence of numbered steps, each with a clear \
goal, a command, and verification. Cover the service startup (one \
terminal per service), the dry-run preview, the actual import, and \
reviewing results. Do not teach concepts — link to \
explanation/architecture.md for the forge integration rationale, \
explanation/quality-bar.md for why reviews matter, and \
reference/cli.md for full command options. Mention that sessions are \
deduplicated automatically so re-running the import is safe. Keep \
the tone directive: 'Run this', 'Check that', not 'You might want to'."""

[topics.tags]
title = "Tag System"
description = "Namespaced tags and their role in retrieval"
complexity = "beginner"
order = 8

[topics.tags.reference]
file = "reference/tags.md"
status = "draft"
covers = [
    "All five tag namespaces with valid values",
    "General vs extracted tier distinction",
    "Tag validation rules",
    "Tag inference from file extensions and keywords",
]
detail = "Tabular. One table per namespace with valid values and sources."
guidance = """Use tables consistently. Show the extension-to-language and \
keyword-to-domain mappings. Cross-link to explanation/retrieval-ranking.md \
for how tags affect ranking, and howto/retrieve-entries.md for practical usage."""

[topics.data-model]
title = "Data Model"
description = "Entry types, Pydantic models, and database schema"
complexity = "intermediate"
order = 9

[topics.data-model.reference]
file = "reference/data-model.md"
status = "draft"
covers = [
    "PlaybookEntry model with all fields (including embedding and feedback counters)",
    "FeedbackInput model",
    "PushExperienceInput model",
    "RetrievalInput and RetrievalResult models",
    "EntryType enum values",
    "Database schema (entries table with embedding and feedback counters)",
    "Ingested sessions tracking table (ingested_sessions)",
    "SessionInfo model for transcript discovery",
]
detail = "Tabular. Field name, type, default, description for each model."
guidance = """Mirror the Pydantic model structure. Use tables for fields. \
Include short illustrative examples (1-3 lines JSON) for each entry type. \
Cross-link to howto/manage-entries.md for usage, tags.md for tag namespaces, \
and explanation/retrieval-ranking.md for scoring context."""

[topics.cli]
title = "CLI"
description = "All pbook commands and their options"
complexity = "beginner"
order = 10

[topics.cli.reference]
file = "reference/cli.md"
status = "draft"
covers = [
    "All pbook commands with synopsis (including pbook ingest)",
    "Options, arguments, and defaults for each command",
    "Exit codes and error handling",
]
detail = "One section per command. Synopsis, options table, example."
guidance = """Use consistent formatting: synopsis, then options table, then \
brief example. Cross-link every command to the relevant how-to guide and \
explanation page. Link to howto/manage-entries.md, howto/retrieve-entries.md, \
howto/push-experience.md, and explanation/quality-bar.md as appropriate."""

[topics.workflows]
title = "Temporal Workflows"
description = "Workflow definitions, activities, and integration"
complexity = "advanced"
order = 11
prerequisites = ["retrieval", "extraction"]

[topics.workflows.reference]
file = "reference/workflows.md"
status = "draft"
covers = [
    "RetrievalWorkflow input/output and steps (including retrieval recording)",
    "ExtractionWorkflow input/output and steps (including embedding generation)",
    "ManualEntryWorkflow input/output and steps (including embedding and semantic dedup)",
    "MaintenanceWorkflow input/output and steps (pruning and consolidation)",
    "ExportWorkflow input/output and steps",
    "TranscriptIngestionWorkflow and BatchIngestionWorkflow (forge-side, cross-queue)",
    "All activities with their parameters and timeouts",
    "Task queue name and cross-queue interaction with forge",
]
detail = "Step-by-step for each workflow. Activity table with timeouts."
guidance = """Use consistent formatting per workflow: input model, output \
model, numbered steps with timeout. Activity summary table at the end. \
Cross-link to howto/retrieve-entries.md, howto/push-experience.md, \
howto/manage-entries.md, data-model.md, and explanation/quality-bar.md."""

[topics.workflows.howto]
file = "howto/temporal-integration.md"
status = "draft"
covers = [
    "How to call pbook workflows from another Temporal worker",
    "How to set up cross-queue workflow execution",
    "How to use pbook as a Python library without Temporal",
]
detail = "Python code examples for each integration path."
guidance = """Show complete, runnable code. Include imports. Cover both \
Temporal and direct library usage. Jump straight to task sections — no \
explanatory preamble. Link to reference/workflows.md for workflow details."""

[topics.architecture]
title = "Architecture"
description = "Design principles and system structure"
complexity = "intermediate"
order = 12

[topics.architecture.explanation]
file = "explanation/architecture.md"
status = "draft"
covers = [
    "Why pbook has its own database and worker",
    "Why tags are namespaced with a controlled vocabulary",
    "The three ingestion paths (extraction, direct submission, transcript ingestion)",
    "Why embeddings for semantic deduplication and maintenance",
    "Function Core / Imperative Shell pattern",
    "How sax-llm provides LLM access",
    "Why transcript ingestion routes LLM calls through forge's batch API",
]
detail = "Discursive. Connect design decisions to the problems they solve."
guidance = """Focus on rationale, not implementation. Defer sax-llm internals \
to that project's documentation — just explain that pbook uses it for LLM \
calls and how the provider is registered. Include a section on the forge \
integration for transcript ingestion: why LLM calls route through forge's \
batch API (cost efficiency, rate limit management), how the cross-queue \
pattern works, and why domain logic stays in pbook while orchestration \
runs on forge. Link to reference/data-model.md for specifics."""
