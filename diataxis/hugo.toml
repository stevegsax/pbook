# Hugo configuration for the Diataxis documentation site.
#
# This file is user-owned. Edit freely — change the theme, add params,
# override layouts, etc. The skill regenerates authored markdown and
# marimo WASM bundles; it never rewrites this file or layouts/.
#
# To use a different theme, replace the `module.imports.path` below with any
# Hugo module theme (see https://themes.gohugo.io/) and run
# `hugo mod get -u`.

title = "pbook"

# Relative URLs make the built site portable (works under `hugo server`,
# any static host, or copied into a subdirectory).
baseURL = "/"
relativeURLs = true
canonifyURLs = false

enableRobotsTXT = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Hugo's default security.http.urls policy denies any URL containing `@`,
# which blocks Hextra's FlexSearch fetch from jsdelivr (the package URL is
# `…/npm/flexsearch@0.8.143/…`). Re-allow https URLs without the `@` deny
# rule so the search bundle can be fetched at build time.
[security]
  [security.http]
    urls = ['(?i)^https?://[a-z]']

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  # Mount the authored quadrant directories into Hugo's content tree.
  # Authored paths stay skill-native; Hugo sees them under content/.
  [[module.mounts]]
    source = "tutorials"
    target = "content/tutorials"
  [[module.mounts]]
    source = "howto"
    target = "content/howto"
  [[module.mounts]]
    source = "reference"
    target = "content/reference"
  [[module.mounts]]
    source = "explanation"
    target = "content/explanation"

  # The Exercises section is optional: it appears only on projects
  # that ship marimo exercises. The mount is always declared so
  # projects can add exercises later without editing hugo.toml. The
  # source directory stays named `examples/` so it does not collide
  # with the `exercises/` source tree that holds the `.py` notebook
  # sources; the user-facing nav label the reader sees is "Exercises",
  # coming from the `title` field in `examples/_index.md`. An empty
  # `examples/` directory (or one containing no `_index.md`) renders
  # no section.
  [[module.mounts]]
    source = "examples"
    target = "content/examples"

  # Mount the authored homepage.
  [[module.mounts]]
    source = "index.md"
    target = "content/_index.md"

  # Mount diataxis.toml as a Hugo data file so themes can read editorial
  # metadata as `hugo.Data.diataxis` (previously `.Site.Data.diataxis`,
  # deprecated in Hugo 0.156+).
  [[module.mounts]]
    source = "diataxis.toml"
    target = "data/diataxis.toml"

  # Static assets (marimo WASM bundles land under static/exercises/<stem>/).
  [[module.mounts]]
    source = "static"
    target = "static"

[params]
  description = "Knowledge playbook service for LLM-assisted workflows"

  [params.math]
    enable = true

  [params.theme]
    default = "system"
    displayToggle = true

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = true

  [params.page]
    width = "wide"

  [params.toc]
    displayTags = true
