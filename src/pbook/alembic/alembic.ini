[alembic]
script_location = %(here)s
# Overridden at runtime by pbook.store.run_migrations() with
# PBOOK_DATABASE_URL. This placeholder only applies if alembic is invoked
# directly without that override.
sqlalchemy.url = postgresql+psycopg://localhost/pbook

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
